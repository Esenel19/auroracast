name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15       # garde-fou C4 (TP3) : pas de job sans durée maximale
    services:
      postgres:            # vraie base PostgreSQL pour le test d'intégration de l'entrepôt
        image: postgres:16
        env:
          POSTGRES_DB: auroracast_test
          POSTGRES_USER: auroracast
          POSTGRES_PASSWORD: test-ci-seulement
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auroracast" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://auroracast:test-ci-seulement@localhost:5432/auroracast_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Vérifier le modèle d'infrastructure Azure (Bicep)
        run: az bicep build --file azure/main.bicep --stdout > /dev/null
      - name: Prévol TP3 (garde-fous de sécurité et de coût, sans appel Azure)
        run: python azure/preflight_tp3.py . azure/plan_tp3.json azure/deploiement_azure.sh "$RUNNER_TEMP/rapport_prevol.json"
      - name: Refuser les marques de conflit Git oubliées
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> |=======$)' -- ':!*.ipynb'; then
            echo "::error::Marques de conflit Git trouvées : résoudre le conflit avant de pousser."
            exit 1
          fi
      - run: pytest -q
