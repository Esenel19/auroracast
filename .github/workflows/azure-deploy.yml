name: Déploiement Azure

# À chaque modification du code sur main :
#   1. construit l'image Docker (API + tâches), la teste (l'API doit répondre), la publie
#      sur GitHub Container Registry (gratuit) : ghcr.io/<compte>/auroracast:<commit> et :latest ;
#   2. si Azure est configuré, se connecte par OIDC (aucun secret : identité gérée
#      id-auroracast-github, fédération limitée à la branche main) et met l'API et les 4 tâches
#      planifiées sur cette nouvelle image.
# Variables à créer après azure/deploiement_azure.sh (Settings > Secrets and variables >
# Actions > Variables) : AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP.
# Une fois, après la première publication : rendre public le paquet « auroracast »
# (profil GitHub > Packages > auroracast > Package settings > Change visibility).

on:
  push:
    branches: [main]
    paths: ["src/**", "web/**", "sql/**", "Dockerfile", "requirements*.txt", "pyproject.toml",
            ".github/workflows/azure-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploiement-azure
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Construire l'image
        run: docker build -t "${{ steps.name.outputs.image }}:${{ github.sha }}" .

      - name: Tester l'image (API avec les modèles du dépôt)
        run: |
          docker run -d --name api -p 8000:8000 -v "$PWD/models:/app/models:ro" \
            "${{ steps.name.outputs.image }}:${{ github.sha }}"
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/api/models > /dev/null
          curl -fs -X POST localhost:8000/api/predict -H 'Content-Type: application/json' \
            -d '{"horizon_h": 24, "mesures": {"kp": 5, "bz_mean_3h": -8}}'
          curl -fs localhost:8000/ | grep -q forecast.json
          docker run --rm --entrypoint python "${{ steps.name.outputs.image }}:${{ github.sha }}" \
            -m auroracast.cloud.jobs --help > /dev/null
          docker rm -f api

      - name: Publier sur GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "${{ steps.name.outputs.image }}:${{ github.sha }}" "${{ steps.name.outputs.image }}:latest"
          docker push "${{ steps.name.outputs.image }}:${{ github.sha }}"
          docker push "${{ steps.name.outputs.image }}:latest"

  azure:
    needs: image
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write          # jeton OIDC échangé contre un accès Azure
      contents: read
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Mettre l'API et les tâches sur la nouvelle image
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt > /dev/null
          az containerapp update -n ca-auroracast-api -g "$RG" --image "$IMAGE" -o none
          for job in collect ghcnh transform train; do
            az containerapp job update -n "caj-auroracast-$job" -g "$RG" --image "$IMAGE" -o none
          done
          url=$(az containerapp show -n ca-auroracast-api -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Application : https://$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Vérifier l'API déployée
        run: |
          url=$(az containerapp show -n ca-auroracast-api -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 20); do curl -fs "https://$url/api/health" && exit 0; sleep 6; done   # démarrage à froid
          echo "::error::L'API ne répond pas" && exit 1
