name: Collecte NOAA horaire

# Collecte automatique toutes les heures, sans PC allumé.
# Les fichiers bruts sont déposés dans Azure Blob Storage (conteneur "raw").
# Prérequis (Settings > Secrets and variables > Actions) :
#   - secret   AZURE_STORAGE_CONNECTION_STRING
#   - variable AURORACAST_CONTACT (adresse de contact envoyée dans le User-Agent)

on:
  schedule:
    - cron: "7 * * * *"   # à hh:07 UTC (éviter hh:00, très chargé chez GitHub)
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main

concurrency:
  group: collecte-noaa
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .

      - name: Collecter
        id: collect
        continue-on-error: true   # on dépose quand même ce qui a réussi
        env:
          AURORACAST_CONTACT: ${{ vars.AURORACAST_CONTACT }}
        run: python -m auroracast.collect.noaa --out raw --run-manifest

      - name: Déposer dans Azure Blob Storage
        if: always()
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          az storage container create --name raw --only-show-errors > /dev/null
          az storage blob upload-batch --destination raw --source raw --only-show-errors

      - name: Signaler un échec partiel
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Au moins une source NOAA a échoué (voir le manifeste de cette exécution)."
          exit 1
