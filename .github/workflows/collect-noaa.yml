name: Collecte NOAA et MET Norway (toutes les 3 h)

# Collecte automatique toutes les 3 heures, sans PC allumé.
# Stockage provisoire et gratuit : les fichiers bruts sont commités dans la
# branche « raw-data » du dépôt (le code reste seul sur « main »).
# Plus tard : ajouter le secret AZURE_STORAGE_CONNECTION_STRING et les fichiers
# partiront aussi dans Azure Blob Storage, sans autre changement.
# Variable conseillée (Settings > Secrets and variables > Actions > Variables) :
#   AURORACAST_CONTACT = adresse de contact envoyée dans le User-Agent

on:
  schedule:
    # Un passage toutes les 3 heures (00:17, 03:17, … UTC), loin des heures pleines.
    # Choix mesuré (INC-003) : le flux NOAA le plus court utile au modèle, le vent solaire
    # temps réel, garde environ 20 h de mesures ; la collecte incrémentale rattrape un
    # passage retardé ou sauté par GitHub tant que l'écart reste sous ces 20 h.
    - cron: "17 */3 * * *"
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write          # nécessaire pour pousser dans la branche raw-data

concurrency:
  group: collecte-noaa
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .

      - name: Lire l'état des passages précédents
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin raw-data > /dev/null; then
            git fetch --quiet --depth 1 origin raw-data
            git archive FETCH_HEAD noaa/manifests | tar -x -C state || echo "Pas encore de manifeste NOAA."
            git archive FETCH_HEAD metno/manifests | tar -x -C state || echo "Pas encore de manifeste MET Norway."
          fi

      - name: Collecter
        id: collect
        continue-on-error: true   # on archive quand même ce qui a réussi
        env:
          AURORACAST_CONTACT: ${{ vars.AURORACAST_CONTACT }}
        run: python -m auroracast.collect.noaa --out raw --run-manifest --state-dir state

      - name: Prévisions météo MET Norway (nuages, brouillard, 60 h)
        id: metno
        continue-on-error: true
        env:
          AURORACAST_CONTACT: ${{ vars.AURORACAST_CONTACT }}
        run: python -m auroracast.collect.metno --out raw --state-dir state --summary "$GITHUB_STEP_SUMMARY"

      - name: Archiver dans la branche raw-data
        if: always()
        run: scripts/archive_to_branch.sh raw raw-data

      - name: Déposer aussi dans Azure Blob Storage (si configuré)
        if: always() && env.AZURE_STORAGE_CONNECTION_STRING != ''
        run: |
          az storage container create --name raw --only-show-errors > /dev/null
          az storage blob upload-batch --destination raw --source raw --only-show-errors

      - name: Signaler un échec partiel
        if: steps.collect.outcome == 'failure' || steps.metno.outcome == 'failure'
        run: |
          echo "::error::Au moins une source NOAA ou MET Norway a échoué (voir les manifestes de cette exécution)."
          exit 1
