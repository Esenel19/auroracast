name: Entraînement des modèles (quotidien)

# Chaque jour vers 10:13 UTC (après la transformation du matin), réentraîne les modèles
# « Kp >= 4 dans les 6, 24 et 48 h » à partir de la vue v_training_kp de l'entrepôt Neon,
# qui contient toutes les données jusqu'à la veille.
#   1. évaluation sur 2024 → aujourd'hui (modèle appris sur 2010-2021) ;
#   2. contrôle qualité : ROC AUC du test < 0,70 → rien n'est publié, l'ancien modèle reste ;
#   3. modèle de production réappris sur toutes les données, publié dans la branche
#      « models » (un commit par jour : historique de chaque version et de ses notes) ;
#   4. si MLflow est configuré (secrets MLFLOW_*) : un run par horizon dans l'expérience
#      auroracast-kp4, modèle accepté enregistré dans le registre (alias « production »).
# L'application lit la dernière version de cette branche à chaque mise à jour (toutes les 3 h),
# et la page « Suivi des modèles » trace l'historique de toutes les versions.

on:
  schedule:
    - cron: "13 10 * * *"
  workflow_dispatch:

permissions:
  contents: write          # pousser dans la branche models

concurrency:
  group: entrainement
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      # Suivi MLflow (serveur DagsHub) : sans ces secrets, l'entraînement tourne sans MLflow.
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-ml.txt && pip install -e .

      - name: Entraîner, évaluer et contrôler
        if: env.NEON_DATABASE_URL != ''
        run: |
          DATABASE_URL="$NEON_DATABASE_URL" python -m auroracast.model.train --out trained
          cat trained/rapport_modele.md >> "$GITHUB_STEP_SUMMARY"

      - name: Rejouer la progression (réentraînement simulé chaque mois depuis 2016)
        if: env.NEON_DATABASE_URL != ''
        run: DATABASE_URL="$NEON_DATABASE_URL" python -m auroracast.model.history backtest --out trained

      - name: Publier dans la branche models
        if: env.NEON_DATABASE_URL != ''
        run: scripts/archive_to_branch.sh trained models "Modèles du jour"
