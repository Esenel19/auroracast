name: Transformation des données

# Recalcule les tables propres (Kp, indices solaires, vent solaire, prévisions, nébulosité,
# météo quotidienne GSOD, météo horaire GHCNh) à partir
# de toutes les données brutes de la branche raw-data, et les publie dans la branche
# clean-data (fichiers Parquet + rapport de qualité). La branche clean-data ne contient
# qu'un seul commit, remplacé à chaque exécution.
#
# Enchaînement : la transformation démarre dès que la collecte GHCNh du matin a RÉUSSI
# (déclenchement workflow_run) ; la chaîne collecte -> transformation -> chargement de
# l'entrepôt a donc des dépendances explicites. Elle suit aussi la collecte NOAA / MET Norway
# (toutes les 3 h) : Kp, vent solaire et prévisions météo de l'application restent frais.
# L'heure fixe de 09:23 UTC reste en secours si la collecte n'a pas tourné ou a échoué.
# En fin de run : prévisions de l'application (forecast.json) publiées sur GitHub Pages.

on:
  workflow_run:
    workflows: ["Collecte météo GHCNh (quotidienne)", "Collecte NOAA et MET Norway (toutes les 3 h)"]
    types: [completed]
  schedule:
    - cron: "23 9 * * *"   # secours, chaque jour vers 09:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write        # publication de l'application (GitHub Pages)
  id-token: write

concurrency:
  group: transformation
  cancel-in-progress: false

jobs:
  transform:
    # après la collecte : seulement si elle a réussi
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}   # vide si le secret n'existe pas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .

      - name: Récupérer les données brutes
        run: |
          git fetch --quiet --depth 1 origin raw-data
          mkdir -p raw && git archive FETCH_HEAD | tar -x -C raw

      - name: Construire les tables propres
        run: python -m auroracast.transform --raw raw --out clean --summary "$GITHUB_STEP_SUMMARY"

      - name: Publier dans la branche clean-data
        run: scripts/publish_to_branch.sh clean clean-data "Tables propres"

      # Entrepôt PostgreSQL dans le cloud (Neon, offre gratuite). Secret NEON_DATABASE_URL :
      # adresse de connexion du projet Neon (Settings > Secrets and variables > Actions > Secrets).
      # Sans ce secret, l'étape est sautée.
      - name: Charger l'entrepôt PostgreSQL (Neon)
        if: env.NEON_DATABASE_URL != ''
        run: DATABASE_URL="$NEON_DATABASE_URL" python -m auroracast.warehouse.load --clean clean --summary "$GITHUB_STEP_SUMMARY"

      # Application du directeur : prévisions des 48 h par lieu (code couleur), page statique.
      - name: Calculer les prévisions de l'application
        if: env.NEON_DATABASE_URL != ''
        run: |
          # derniers modèles du jour (branche models) ; à défaut, ceux du dépôt
          if git ls-remote --exit-code --heads origin models > /dev/null; then
            git fetch --quiet --depth 1 origin models
            rm -rf models && mkdir models && git archive FETCH_HEAD | tar -x -C models
          fi
          DATABASE_URL="$NEON_DATABASE_URL" python -m auroracast.app.predict --out site --models models
          cp web/index.html site/index.html

      - name: Préparer la publication de l'application
        if: env.NEON_DATABASE_URL != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publication sur GitHub Pages (à activer une fois : Settings > Pages > Source : GitHub Actions)
  application:
    needs: transform
    if: needs.transform.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
