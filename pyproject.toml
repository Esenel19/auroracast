[project]
name = "auroracast"
version = "0.1.0"
description = "Prévision de la visibilité des aurores boréales"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "python-dotenv>=1.0", "pandas>=2.2", "pyarrow>=15", "google-cloud-bigquery>=3.20",
                "ephem>=4.1", "psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auroracast = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
